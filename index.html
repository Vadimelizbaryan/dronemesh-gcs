:root{
  --bg:#0f1115; --card:#1b1f27; --card2:#232833; --text:#e8ecf3; --muted:#9aa4b2;
  --green:#34c759; --red:#ff453a; --blue:#0a84ff; --yellow:#ffd60a; --orange:#ff9f0a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font-family:inherit}
#login{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:14px;padding:24px 16px;z-index:50}
#login h1{margin:0 0 6px;font-size:26px;letter-spacing:.5px}
#login p{margin:0;color:var(--muted);font-size:14px;text-align:center;max-width:340px}
#login input{width:100%;max-width:340px;padding:14px;border-radius:12px;border:1px solid #2c333f;
  background:var(--card);color:var(--text);font-size:16px}
#login button,.bigbtn{width:100%;max-width:340px;padding:15px;border-radius:12px;border:0;
  background:var(--blue);color:#fff;font-size:17px;font-weight:700}
#login .err{color:var(--red);font-size:14px;min-height:18px;text-align:center}
#app{position:fixed;inset:0;display:none;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;background:#111}
#map{position:absolute;inset:0}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none;z-index:1100} /* above Leaflet controls (z 1000) */
#topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);
  font-size:14px;font-weight:600}
#dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}
#status{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#topbar .icon{background:var(--card2);color:var(--text);border:0;border-radius:9px;
  padding:8px 10px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;min-height:36px}
#sheet{background:var(--card);max-height:50vh;overflow-y:auto;
  box-shadow:0 -6px 20px #0008;padding:8px 12px 16px}
#tele{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:6px 0 12px}
.row .k{color:var(--muted);font-size:11px}
.row .v{font-size:16px;font-weight:700}
#cell{grid-column:1 / -1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{padding:14px 8px;border-radius:11px;border:1px solid #2c333f;background:var(--card2);
  color:var(--text);font-size:15px;font-weight:700}
.grid button.red{color:var(--red)} .grid button.blue{color:var(--blue)} .grid button.green{color:var(--green)}
.section{color:var(--muted);font-size:12px;margin:12px 2px 4px}
#cal{color:var(--yellow);font-size:13px;font-weight:700;margin:6px 2px;min-height:16px}
#handle{width:40px;height:4px;border-radius:2px;background:#3a414d;margin:2px auto 8px}
.leaflet-container{background:#111}
</style>
</head>
<body>

<div id="login">
  <h1>DroneMesh</h1>
  <p>Облачный пульт DroneEngage. Введите данные доступа (как в приложении).</p>
  <input id="email" type="email" inputmode="email" autocomplete="username" placeholder="Login (e-mail)">
  <input id="code" type="password" autocomplete="current-password" placeholder="Access Code">
  <label style="color:var(--muted);font-size:13px"><input id="remember" type="checkbox" checked> Запомнить на телефоне</label>
  <button id="connectBtn">Подключиться к облаку</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app">
  <div id="topbar">
    <span id="dot"></span>
    <span id="status">Подключение…</span>
    <button class="icon" id="voiceBtn" title="Голос">🔊</button>
    <button class="icon" id="exitBtn" title="Выход" aria-label="Выход"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></button>
  </div>
  <div id="stage">
    <div id="map"></div>
    <video id="video" autoplay playsinline muted></video>
  </div>
  <div id="sheet">
    <div id="handle"></div>
    <button id="videoBtn2" class="bigbtn" style="max-width:none;margin:2px 0 10px;background:var(--card2);color:var(--text)">📹 Видео с камеры</button>
    <div id="tele">
      <div class="row"><div class="k">Режим</div><div class="v" id="t-mode">—</div></div>
      <div class="row"><div class="k">Батарея</div><div class="v" id="t-batt">—</div></div>
      <div class="row"><div class="k">Высота</div><div class="v" id="t-alt">—</div></div>
      <div class="row"><div class="k">Скорость / курс</div><div class="v" id="t-spd">—</div></div>
      <div class="row"><div class="k">GPS</div><div class="v" id="t-gps">—</div></div>
      <div class="row"><div class="k">Координаты</div><div class="v" id="t-pos">—</div></div>
      <div class="row" id="cell"><div class="k">4G вышка</div><div class="v" id="t-cell">—</div></div>
    </div>
    <div class="section">Управление</div>
    <div class="grid">
      <button class="red" data-act="arm">Взвести</button>
      <button data-act="disarm">Снять</button>
      <button class="blue" data-act="RTL">Домой (RTL)</button>
      <button class="blue" data-act="LAND">Посадка</button>
      <button data-act="LOIT">Удержание</button>
      <button data-act="ALTH">Высота</button>
    </div>
    <div class="section">Перед взлётом</div>
    <div class="grid">
      <button class="green" data-act="magcal">Калибровка компаса</button>
      <button data-act="magcancel">Отмена калибровки</button>
      <button class="red" data-act="reboot" style="grid-column:1 / -1">Перезагрузка полётника</button>
    </div>
    <div id="cal"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
window.addEventListener('error', e => { try{
  document.getElementById('status').textContent = 'Ошибка: ' + (e.message||e);
  document.getElementById('dot').style.background = 'var(--red)'; }catch(_){} });
const AUTH_URL = "https://cloud.ardupilot.org:19408/w/wl/";
const PARTY = "MP_WEB_" + (Date.now()%100000) + "_" + Math.floor(Math.random()*1000);

// ---- MAVLink: modes, message ids, commands ------------------------------------
const COPTER_MODES = {0:"STAB",1:"ACRO",2:"ALTH",3:"AUTO",4:"GUID",5:"LOIT",6:"RTL",
  7:"CIRC",9:"LAND",11:"DRFT",13:"SPRT",14:"FLIP",15:"ATUN",16:"POSH",17:"BRAK",
  18:"THRW",20:"GNGP",21:"SRTL",22:"FHLD",23:"FOLL",24:"ZIGZ",25:"SYSI",26:"AUTR",27:"ARTL"};
const MODE_RU = {STAB:"стабилизация",ACRO:"акро",ALTH:"удержание высоты",AUTO:"авто",
  GUID:"управляемый",LOIT:"удержание позиции",RTL:"возврат домой",CIRC:"круг",LAND:"посадка",
  POSH:"удержание позиции",BRAK:"торможение",SRTL:"умный возврат",ALTHOLD:"удержание высоты"};
const MODE_NUM = {LOIT:5,RTL:6,LAND:9,ALTH:2,GUID:4,STAB:0};
const MAG_CAL = {0:"не начата",1:"ожидание",2:"вращайте дрон (шаг 1)",3:"вращайте дрон (шаг 2)",
  4:"успех",5:"ошибка",6:"неверная ориентация",7:"мало данных"};
const ARMED_FLAG=128, CRC_EXTRA={76:152,11:89};
const ARM_DISARM=400, REBOOT=246, START_MAG=42424, CANCEL_MAG=42426;

function mavCrc(bytes, extra){
  let crc=0xFFFF;
  const acc=b=>{let t=b^(crc&0xFF);t=(t^(t<<4))&0xFF;crc=((crc>>8)^(t<<8)^(t<<3)^(t>>4))&0xFFFF;};
  for(const b of bytes) acc(b); acc(extra); return crc;
}
let txSeq=0;
function frame(msgid, payload){
  txSeq=(txSeq+1)&0xFF;
  const hdr=[0xFD,payload.length,0,0,txSeq,255,190,msgid&0xFF,(msgid>>8)&0xFF,(msgid>>16)&0xFF];
  const body=hdr.concat(Array.from(payload));
  const crc=mavCrc(body.slice(1), CRC_EXTRA[msgid]);
  body.push(crc&0xFF, crc>>8);
  return new Uint8Array(body);
}
function f32(v){const b=new Uint8Array(4);new DataView(b.buffer).setFloat32(0,v,true);return b;}
function commandLong(target, cmd, p1=0,p2=0,p3=0,p4=0,p5=0,p6=0,p7=0){
  const buf=new Uint8Array(33); const dv=new DataView(buf.buffer);
  [p1,p2,p3,p4,p5,p6,p7].forEach((p,i)=>dv.setFloat32(i*4,p,true));
  dv.setUint16(28,cmd,true); buf[30]=target; buf[31]=1; buf[32]=0;
  return frame(76, buf);
}
function setMode(target, custom){
  const buf=new Uint8Array(6); const dv=new DataView(buf.buffer);
  dv.setUint32(0,custom,true); buf[4]=target; buf[5]=1; // CUSTOM_MODE_ENABLED
  return frame(11, buf);
}

// ---- MAVLink parser (subset) --------------------------------------------------
const S = { frames:0, lastAt:0, teleAt:0, mode:null, armed:null, volt:null, cur:null,
  pct:null, alt:null, vspeed:null, gspeed:null, heading:null, fix:null, sats:null,
  lat:null, lon:null, posAt:0, roll:null, pitch:null, yaw:null, sysid:null,
  cell:{enb:null,sec:null,tac:null,rsrp:null,at:0}, magStatus:null, magPct:null, magReport:null, magAt:0,
  statusText:null, statusSev:null, statusSeq:0 };
let rxBuf=new Uint8Array(0);
function feed(bytes){
  const merged=new Uint8Array(rxBuf.length+bytes.length); merged.set(rxBuf); merged.set(bytes,rxBuf.length);
  rxBuf=merged;
  let i=0;
  while(true){
    while(i<rxBuf.length && rxBuf[i]!==0xFD && rxBuf[i]!==0xFE) i++;
    if(i>=rxBuf.length){ rxBuf=new Uint8Array(0); break; }
    if(rxBuf.length-i<3) { rxBuf=rxBuf.slice(i); break; }
    let total, msgid, poff, plen, sysid, compid;
    if(rxBuf[i]===0xFD){
      plen=rxBuf[i+1]; const incompat=rxBuf[i+2];
      total=12+plen+((incompat&0x01)?13:0);
      if(rxBuf.length-i<total){ rxBuf=rxBuf.slice(i); break; }
      sysid=rxBuf[i+5]; compid=rxBuf[i+6];
      msgid=rxBuf[i+7]|(rxBuf[i+8]<<8)|(rxBuf[i+9]<<16); poff=i+10;
    } else {
      plen=rxBuf[i+1]; total=8+plen;
      if(rxBuf.length-i<total){ rxBuf=rxBuf.slice(i); break; }
      sysid=rxBuf[i+3]; compid=rxBuf[i+4]; msgid=rxBuf[i+5]; poff=i+6;
    }
    handle(msgid, rxBuf.subarray(poff, poff+plen), sysid, compid);
    i+=total;
  }
}
function pad(a,n){ if(a.length>=n) return a; const b=new Uint8Array(n); b.set(a); return b; }
function handle(msgid, p, sysid, compid){
  const now=Date.now()/1000; S.frames++; S.lastAt=now;
  const dv=new DataView(p.buffer, p.byteOffset, p.byteLength);
  const g=(o,t)=>{const q=pad(p,o+8); const d=new DataView(q.buffer,q.byteOffset); return t(d,o);};
  if(msgid===0 && compid===1){
    const q=pad(p,9); const d=new DataView(q.buffer,q.byteOffset);
    const custom=d.getUint32(0,true), base=q[6];
    S.teleAt=now; S.sysid=sysid; S.mode=COPTER_MODES[custom]||("M"+custom); S.armed=!!(base&ARMED_FLAG);
  } else if(msgid===1){
    const q=pad(p,31); const d=new DataView(q.buffer,q.byteOffset);
    const v=d.getUint16(14,true), c=d.getInt16(16,true), pc=d.getInt8(30);
    S.volt=(v&&v!==0xFFFF)?v/1000:null; S.cur=(c!==-1)?c/100:null; S.pct=(pc>=0&&pc<=100)?pc:null;
  } else if(msgid===24){
    const q=pad(p,30); S.fix=q[28]; S.sats=q[29]===255?null:q[29];
  } else if(msgid===33){
    const q=pad(p,28); const d=new DataView(q.buffer,q.byteOffset);
    S.lat=d.getInt32(4,true)/1e7; S.lon=d.getInt32(8,true)/1e7; S.alt=d.getInt32(16,true)/1000; S.posAt=now;
  } else if(msgid===74){
    const q=pad(p,20); const d=new DataView(q.buffer,q.byteOffset);
    S.gspeed=d.getFloat32(4,true); S.vspeed=d.getFloat32(12,true); S.heading=d.getInt16(16,true);
  } else if(msgid===30){
    const q=pad(p,28); const d=new DataView(q.buffer,q.byteOffset);
    S.roll=d.getFloat32(4,true); S.pitch=d.getFloat32(8,true); S.yaw=d.getFloat32(12,true);
  } else if(msgid===191){
    const q=pad(p,27); S.magStatus=q[14]; S.magPct=q[16]; S.magReport=null; S.magAt=now;
  } else if(msgid===192){
    const q=pad(p,44); S.magStatus=q[42]; S.magReport=[q[42],q[43]]; S.magAt=now;
  } else if(msgid===252){
    const q=pad(p,18); const d=new DataView(q.buffer,q.byteOffset);
    const val=d.getInt32(4,true);
    let name=""; for(let k=8;k<18 && q[k];k++) name+=String.fromCharCode(q[k]);
    if(name==="CELL_ENB") S.cell.enb=val; else if(name==="CELL_SEC") S.cell.sec=val;
    else if(name==="CELL_TAC") S.cell.tac=val; else if(name==="CELL_RSRP") S.cell.rsrp=val;
    if(name.startsWith("CELL_")) S.cell.at=now;
  } else if(msgid===253){
    const q=pad(p,52); let t=""; for(let k=1;k<51 && q[k];k++) t+=String.fromCharCode(q[k]);
    if(t){ S.statusText=t; S.statusSev=q[0]; S.statusSeq++; }
  }
}

// ---- Cloud WebSocket client ---------------------------------------------------
let ws=null, unitId=null, unitName=null, units={}, idTimer=0, wantConnected=false;
const enc=new TextEncoder(), dec=new TextDecoder();
function envelope(ty, mt, ms, tg){ const m={ty,sd:PARTY,st:"w",mt,ms}; if(tg!=null) m.tg=tg; return m; }
function sendText(obj){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(obj)); }
function sendMavlink(bytes){
  if(!ws||ws.readyState!==1||unitId==null) return false;
  const hdr=enc.encode(JSON.stringify(envelope("i",6502,{},unitId))+"\0");
  const out=new Uint8Array(hdr.length+bytes.length); out.set(hdr); out.set(bytes,hdr.length);
  ws.send(out); return true;
}
async function login(email, code){
  const r=await fetch(AUTH_URL,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({acc:email,pwd:code,gr:"1",app:"de",ver:"1",ex:"DRONE ENGAGE Web Client",at:"g"})});
  const j=await r.json();
  if(j.e!==0) throw new Error(j.em||("код "+j.e));
  return {host:j.cs.g, port:parseInt(j.cs.h), key:j.cs.f};
}
let connecting=false, reconnects=0;
async function connect(email, code){
  if(connecting) return;            // one login at a time (avoid request storms)
  if(ws && ws.readyState<2) return; // already open or opening: no second socket
  connecting=true; wantConnected=true;
  try{
    setStatus("yellow","Вход в облако…");
    const {host,port,key}=await login(email,code);
    setStatus("yellow","Подключение к "+host+"…");
    ws=new WebSocket("wss://"+host+":"+port); ws.binaryType="arraybuffer";
    ws.onopen=()=>{ unitId=null; units={};
      sendText({ty:"s",mt:"de_auth",f:key,s:PARTY,at:"g"}); };
    ws.onmessage=onMessage;
    ws.onclose=e=>{ clearInterval(idTimer); reconnects++;
      if(wantConnected){
        setStatus("red","Облако закрыло связь (код "+e.code+(e.reason?(": "+e.reason):"")+
          ", раз "+reconnects+"), повтор через 10 с…");
        setTimeout(()=>connect(email,code),10000);} };
    ws.onerror=()=>{};
    connecting=false;
  }catch(e){
    connecting=false;
    const rate=/too many|many request|429|slow down|limit/i.test(e.message||"");
    setStatus("red","Ошибка входа: "+e.message+(rate?" — слишком много попыток, жду":""));
    if(wantConnected) setTimeout(()=>connect(email,code), rate?45000:10000);
  }
}
function onMessage(ev){
  if(typeof ev.data==="string"){
    let m; try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.mt==="de_auth_ack"){
      if(m.r!=="ok"){ setStatus("red","Облако отклонило сессию"+(m.em?(": "+m.em):"")); return; }
      setStatus("green","Облако подключено, ищу дрон…");
      sendId(); requestIds();
      clearInterval(idTimer);
      idTimer=setInterval(()=>{ sendId(); if(unitId==null) requestIds(); if(videoWanted&&!pc) joinCamera(); }, 10000);
    } else if(m.mt===1004){
      if(m.ms&&m.ms.GS!==true){ units[m.sd]=String(m.ms.UD||""); perms[m.sd]=String(m.ms.p||""); joinCamera(); }
    } else if(m.mt===1012){ onCameraList(m.sd, (m.ms&&m.ms.T)||[]); }
    else if(m.mt===1021){ onSignal(m.sd, m.ms||{}); }
    return;
  }
  const u=new Uint8Array(ev.data); const z=u.indexOf(0); if(z<0) return;
  let hdr; try{hdr=JSON.parse(dec.decode(u.subarray(0,z)));}catch(e){return;}
  if(hdr.mt!==6502) return;
  if(unitId==null){
    const name=units[hdr.sd]; if(name==null) return;
    unitId=hdr.sd; unitName=name; setStatus("green",name+" — на связи");
  }
  if(hdr.sd!==unitId) return;
  feed(u.subarray(z+1));
}
function sendId(){ sendText(envelope("g",1004,{VT:999,GS:true,VR:0,SD:false,UD:PARTY,DS:"DroneMesh web",p:""})); }
function requestIds(){ sendText(envelope("g",1005,{C:1004})); }

// ---- Camera video over WebRTC (same signalling as the WebClient) --------------
const perms={};                       // unit id -> capability string
let pc=null, camChannel=null, camUnit=null, videoWanted=false, candIn=0, iceTimer=null;
const ICE=[{urls:"stun:stun.l.google.com:19302"},
           {urls:"stun:stun1.l.google.com:19302"},
           {urls:["turn:cloud.ardupilot.org:3478","turn:cloud.ardupilot.org:3478?transport=tcp"],
            username:"andruav_ap",credential:"1234"}];
function hasVideo(p){ return typeof p==="string" && p.length>8 && p[8]==="V"; }
function videoUnit(){ return Object.keys(perms).find(u=>hasVideo(perms[u])); }
function signalSend(packet){ sendText(envelope("i",1021,{w:{channel:camChannel,packet}},camUnit)); }
function joinCamera(){
  if(pc || !videoWanted) return;
  const u=videoUnit(); if(!u) return;         // no camera-capable unit announced yet
  camUnit=u;
  sendText(envelope("i",1005,{C:1012},camUnit)); // REMOTE_EXECUTE -> camera list
}
function onCameraList(sender, tracks){
  if(pc || sender!==camUnit || !tracks || !tracks.length) return;
  camChannel=String(tracks[0].id||""); candIn=0;
  pc=new RTCPeerConnection({iceServers:ICE});
  pc.ontrack=e=>{ const v=el('video'); if(v.srcObject!==e.streams[0]) v.srcObject=e.streams[0];
    if(v.play) v.play().catch(()=>{}); showVideo(true); setStatus('green',(unitName||'дрон')+' — видео идёт'); };
  // Candidates go out embedded in the answer AND trickled: on mobile the TURN
  // relay candidate is often gathered after the answer, and only trickle delivers it.
  pc.onicecandidate=e=>{ if(e.candidate) signalSend({candidate:e.candidate.candidate,
    sdpMid:e.candidate.sdpMid, sdpMLineIndex:e.candidate.sdpMLineIndex}); };
  pc.oniceconnectionstatechange=()=>{ if(!pc) return; const s=pc.iceConnectionState;
    clearTimeout(iceTimer);
    if(s==='connected'||s==='completed') setStatus('green',(unitName||'дрон')+' — видео идёт');
    else if(s==='failed'){ setStatus('yellow','Видео: связь потеряна, переподключаю…'); restartVideo(); }
    else if(s==='disconnected'){
      // Packet loss (weak 4G): give WebRTC 8 s to recover by itself, then rejoin.
      setStatus('yellow','Видео: связь прерывается…');
      iceTimer=setTimeout(()=>{ if(pc && pc.iceConnectionState==='disconnected'){
        setStatus('yellow','Видео: переподключаю…'); restartVideo(); } },8000);
    }
    else if(s==='checking') setStatus('yellow','Видео: устанавливаю соединение…'); };
  signalSend({joinme:true});
}
function iceComplete(p){ return new Promise(res=>{
  if(p.iceGatheringState==='complete') return res();
  const done=()=>{ if(p.iceGatheringState==='complete'){ clearTimeout(t); p.removeEventListener('icegatheringstatechange',done); res(); } };
  const t=setTimeout(()=>{ p.removeEventListener('icegatheringstatechange',done); res(); },4000);
  p.addEventListener('icegatheringstatechange',done);
});}
async function onSignal(sender, ms){
  if(!pc || sender!==camUnit) return;
  const sig=ms.w||ms;
  if(sig.channel!=null && String(sig.channel)!==camChannel) return;
  const packet=sig.packet||{};
  try{
    if(packet.type==="offer"){
      await pc.setRemoteDescription({type:"offer",sdp:packet.sdp});
      await pc.setLocalDescription(await pc.createAnswer());
      await iceComplete(pc);     // like aiortc: send the answer with all candidates in it
      signalSend({type:"answer",sdp:pc.localDescription.sdp});
    } else if(packet.candidate){
      let c=String(packet.candidate).trim();
      if(c.startsWith("a=")) c=c.slice(2);
      if(c && !c.startsWith("candidate:")) c="candidate:"+c;   // browser wants the "candidate:" form
      try{ await pc.addIceCandidate({candidate:c, sdpMid:packet.sdpMid||"0",
        sdpMLineIndex:packet.sdpMLineIndex==null?0:packet.sdpMLineIndex}); candIn++; }
      catch(err){ /* ignore a single bad candidate */ }
      if(pc.iceConnectionState!=='connected' && pc.iceConnectionState!=='completed')
        setStatus('yellow','Видео: соединение… (ICE '+pc.iceConnectionState+', канд. '+candIn+')');
    } else if(packet.hangup){ stopCamera(true); }   // the 10 s timer rejoins while video is wanted
  }catch(e){ setStatus('red','Видео: '+e.message); }
}
// keepFrame: leave the last picture on screen while we reconnect.
function stopCamera(keepFrame){ clearTimeout(iceTimer);
  if(pc){ try{signalSend({hangup:true});}catch(e){} try{pc.close();}catch(e){} pc=null; }
  if(!keepFrame){ const v=el('video'); v.srcObject=null; } }
let lastRestart=0;
function restartVideo(){
  if(!videoWanted) return;
  const now=Date.now(); if(now-lastRestart<5000) return;   // no restart storms
  lastRestart=now; stopCamera(true); joinCamera();
}
function showVideo(on){ el('video').style.display=on?'block':'none'; }

// ---- UI ------------------------------------------------------------------------
let map, marker, track=[], poly, follow=true, voiceOn=true;
function initMap(){
  map=L.map('map',{zoomControl:true,attributionControl:false}).setView([40.1792,44.4991],12);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    {maxZoom:19,attribution:"© Esri"}).addTo(map);
  map.on('dragstart',()=>{follow=false;});
}
function setStatus(color,text){
  document.getElementById('status').textContent=text;
  const c={green:'var(--green)',yellow:'var(--yellow)',red:'var(--red)',muted:'var(--muted)'}[color]||'var(--muted)';
  document.getElementById('dot').style.background=c;
}
const el=id=>document.getElementById(id);
function fmt(v,suf,dig){ return v==null?"—":(dig!=null?v.toFixed(dig):v)+(suf||""); }
function render(){
  const now=Date.now()/1000;
  el('t-mode').textContent=(S.mode?(MODE_RU[S.mode]||S.mode):"—")+(S.armed?" · взведён":(S.armed===false?" · снят":""));
  el('t-mode').style.color=S.armed?'var(--red)':'var(--text)';
  el('t-batt').textContent=[fmt(S.volt,"В",1),fmt(S.cur,"А",1),fmt(S.pct,"%",0)].filter(x=>x!=="—").join(" · ")||"—";
  el('t-alt').textContent=fmt(S.alt,"м",1)+"  ↕ "+(S.vspeed==null?"—":(S.vspeed>=0?"+":"")+S.vspeed.toFixed(1));
  el('t-spd').textContent=fmt(S.gspeed,"м/с",1)+"  "+fmt(S.heading,"°",0);
  const fx={0:"нет GPS",1:"нет фикса",2:"2D",3:"3D",4:"DGPS",5:"RTK",6:"RTK"}[S.fix]||"";
  el('t-gps').textContent="спутн. "+fmt(S.sats,"",0)+"  "+fx;
  const hasPos=S.lat!=null && !(S.lat===0&&S.lon===0) && now-S.posAt<10;
  el('t-pos').textContent=hasPos?(S.lat.toFixed(6)+", "+S.lon.toFixed(6)):"нет координат";
  // 4G
  if(S.cell.enb!=null && now-S.cell.at<30){
    el('t-cell').textContent="eNB "+S.cell.enb+(S.cell.sec!=null?(", сектор "+S.cell.sec):"")+" · "+fmt(S.cell.rsrp,"дБм",0);
  } else el('t-cell').textContent="—";
  // mag cal
  const cal=el('cal');
  if(S.magStatus!=null && now-S.magAt<60){
    if(S.magReport){ const ok=S.magReport[0]===4;
      cal.textContent="Компас: "+(ok?"успех — перезагрузите полётник":MAG_CAL[S.magReport[0]]);
      cal.style.color=ok?'var(--green)':'var(--red)';
    } else { cal.textContent="Компас: "+(MAG_CAL[S.magStatus]||"?")+" · "+(S.magPct||0)+"%"; cal.style.color='var(--yellow)'; }
  } else cal.textContent="";
  // map
  if(hasPos){
    const ll=[S.lat,S.lon];
    if(!marker){ marker=L.circleMarker(ll,{radius:7,color:'#fff',weight:2,fillColor:'#ff453a',fillOpacity:1}).addTo(map); map.setView(ll,17); }
    else marker.setLatLng(ll);
    const last=track[track.length-1];
    if(!last||last[0]!==ll[0]||last[1]!==ll[1]){ track.push(ll); if(track.length>3000)track.shift();
      if(track.length>1){ if(!poly) poly=L.polyline(track,{color:'#ff453a',weight:3}).addTo(map); else poly.setLatLngs(track);} }
    if(follow) map.setView(ll);
  }
  announce();
}
// voice
let aMode=null,aArmed=null,aStep=null,aMag=null;
const BAT=[50,30,20,10];
function say(t){ if(!voiceOn||!('speechSynthesis'in window))return; const u=new SpeechSynthesisUtterance(t); u.lang='ru-RU'; speechSynthesis.speak(u); }
function announce(){
  const now=Date.now()/1000; if(now-S.teleAt>4) return;
  if(S.mode&&S.mode!==aMode){ if(aMode!==null) say("Режим: "+(MODE_RU[S.mode]||S.mode)); aMode=S.mode; }
  if(S.armed!=null&&S.armed!==aArmed){ if(aArmed!==null||S.armed) say(S.armed?"Моторы взведены":"Моторы выключены"); aArmed=S.armed; }
  if(S.pct!=null){ const step=BAT.filter(x=>S.pct<=x).pop(); if(step!=null&&(aStep==null||step<aStep)){ say("Батарея "+S.pct+" процентов"); } aStep=step; }
  if(S.magReport){ const k=S.magReport[0]+"|"+now.toFixed(0); if(k.split("|")[0]!==aMag){ aMag=k.split("|")[0]; say(S.magReport[0]===4?"Компас откалиброван":"Ошибка калибровки компаса"); } }
}
setInterval(render,500);

// control actions
const NAMES={RTL:"возврат домой",LAND:"посадку",LOIT:"удержание позиции",ALTH:"удержание высоты"};
function act(a){
  const t=S.sysid||1;
  if(a==="arm"){ if(confirm("Взвести моторы? Дрон может начать вращать винты.")) send(commandLong(t,ARM_DISARM,1),"взвод"); }
  else if(a==="disarm"){ if(confirm("Снять моторы?")) send(commandLong(t,ARM_DISARM,0),"снятие"); }
  else if(a==="reboot"){ if(confirm("Перезагрузить полётник? Только на земле, моторы сняты.")) send(commandLong(t,REBOOT,1),"перезагрузка"); }
  else if(a==="magcal"){ if(confirm("Начать калибровку компаса? После старта медленно вращайте дрон по всем осям до 100%.")) send(commandLong(t,START_MAG,0,1,1,0,0),"старт калибровки"); }
  else if(a==="magcancel"){ send(commandLong(t,CANCEL_MAG,0),"отмена калибровки"); }
  else if(MODE_NUM[a]!=null){ if(confirm("Включить "+(NAMES[a]||a)+"?")) send(setMode(t,MODE_NUM[a]),NAMES[a]||a); }
}
function send(bytes,what){ if(!sendMavlink(bytes)) alert("Нет связи с дроном через облако."); }
document.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>act(b.dataset.act));

// Keep the phone screen on while the pult is open: when the screen dims, Android
// Chrome freezes the tab and drops its cloud connection.
let wakeLock=null, lastLogin=null;
async function keepAwake(){ try{ if('wakeLock' in navigator && !wakeLock){
  wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{ wakeLock=null; }); } }catch(e){} }
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  keepAwake();
  // Back on the tab with the cloud link gone: reconnect now instead of waiting.
  if(lastLogin && wantConnected && (!ws || ws.readyState>1)) connect(lastLogin[0], lastLogin[1]);
});

// login/app wiring
function openApp(){
  keepAwake();
  el('login').style.display='none'; el('app').style.display='flex';
  if(!map){ try{ initMap(); }catch(e){ setStatus('red','Карта не загрузилась: '+e.message); } }
  setTimeout(()=>{ try{ map&&map.invalidateSize(); }catch(e){} },200);
}
function start(email,code,remember){
  if(remember){ localStorage.setItem('de_email',email); localStorage.setItem('de_code',code); }
  else { localStorage.removeItem('de_email'); localStorage.removeItem('de_code'); }
  openApp();
  lastLogin=[email,code];
  connect(email,code);   // connect even if the map failed
}
el('connectBtn').onclick=()=>{
  const email=el('email').value.trim(), code=el('code').value.trim();
  if(!email||!code){ el('loginErr').textContent="Введите login и Access Code"; return; }
  start(email,code,el('remember').checked);
};
function toggleVideo(){
  if(videoWanted){ videoWanted=false; stopCamera(); showVideo(false); setStatus('green',(unitName||'дрон')+' — на связи'); }
  else { videoWanted=true; joinCamera(); setStatus('yellow', videoUnit()?'Подключаю видео…':'Жду камеру дрона…'); }
  const b=el('videoBtn2'); if(b) b.textContent=videoWanted?'🗺️ Скрыть видео (карта)':'📹 Видео с камеры';
}
el('videoBtn2').onclick=toggleVideo;
el('voiceBtn').onclick=()=>{ voiceOn=!voiceOn; el('voiceBtn').textContent=voiceOn?'🔊':'🔇'; if(voiceOn) say("Голос включён"); };
el('exitBtn').onclick=()=>{ wantConnected=false; if(ws)ws.close(); el('app').style.display='none'; el('login').style.display='flex'; };
// prefill + follow re-enable on marker tap
(function(){ const e=localStorage.getItem('de_email'), c=localStorage.getItem('de_code');
  if(e) el('email').value=e; if(c) el('code').value=c; })();
el('map').addEventListener('dblclick',()=>{follow=true;});
</script>
